# Connection details and secrets come from the environment. There are deliberately
# no defaults for the credentials: the application should fail loudly rather than
# start with a value someone could guess.
#
# Local development reads them from application-local.properties (gitignored, see
# spring.profiles.default below). Containers and servers pass real environment
# variables instead and run with a different profile.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isdemir}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# When no profile is given explicitly, use "local". Setting SPRING_PROFILES_ACTIVE
# (as the container does) overrides this and the local file is ignored.
spring.profiles.default=supabase

# Flyway owns the schema: db/migration holds every table as versioned SQL.
# baseline-on-migrate stamps an already-populated database (the original laptop
# install) at V1 instead of trying to recreate tables that are already there.
# An empty database - a fresh container - is unaffected and runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_schema

# validate, not none: Hibernate now compares every entity against the real schema at
# startup, so an entity/column mismatch is a boot failure instead of a runtime error
# on the first query that touches it. Flyway is what actually creates tables.
spring.jpa.hibernate.ddl-auto=validate

# JWT settings. The secret must be at least 256 bit (32 bytes) for HS256.
# Access token lifetime in milliseconds (3600000 = 60 minutes).
# Refresh token lifetime (604800000 = 7 days).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
# Suresi dolmus refresh tokenlarin silinme zamani (cron). Varsayilan her gece 03:00.
# Test icin ornek: her dakika -> 0 * * * * *
jwt.cleanup-cron=0 0 3 * * *

# Accept a single object body as a one element array too, so events (and later materials)
# can be sent single or multiple to the same URL: {...} or [{...},{...}].
spring.jackson.deserialization.accept-single-value-as-array=true

# Logging. Logback comes with spring-boot-starter-web, no extra dependency needed.
# Console + logs/isdemir.log (rolls daily, keeps 7 days).
logging.file.name=logs/isdemir.log
logging.logback.rollingpolicy.max-history=7

# Our own packages: every log call is visible.
logging.level.com.isdemir.isdemirdb=DEBUG

# Incoming request logging (method, URL, body, headers) - this is the Postman traffic.
logging.level.org.springframework.web=DEBUG
spring.mvc.log-request-details=true

# The SQL Hibernate actually runs, with the bound parameter values.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Dokum fotograflari Supabase Storage'daki "fotograflar" bucket'inda duruyor (mobil
# uygulama oraya yukluyor, dokum_fotograf tablosunda sadece kaydin bilgisi var).
# Bucket private oldugu icin baytlari backend service key ile cekip frontend'e veriyor.
# Gercek degerler application-supabase.properties'te (gitignored) ya da ortam
# degiskeninde; burada bos default var, ayarli degilse fotograf 404 doner.
supabase.storage-url=${SUPABASE_STORAGE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Panelden yuklenen dokum fotograflari. Varsayilan 1MB, telefon fotografi rahat asiyor.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
