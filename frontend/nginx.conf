server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API ve auth istekleri backend'e iletilir. Tarayici her seyi ayni adresten
    # (localhost:3000) gordugu icin ortada CORS diye bir problem kalmiyor.
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router BrowserRouter kullaniyor: /dashboard, /timeline gibi adreslerin
    # diskte karsiligi yok. Bulunamayan her yolu index.html'e dusur, rotayi React cozsun.
    # Bu satir olmazsa sayfa yenilendiginde nginx 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite dosya adlarina hash basiyor (index-a1b2c3.js), icerik degisince ad da degisir.
    # Bu yuzden uzun cache guvenli. index.html hasli degil, o cache'lenmemeli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
